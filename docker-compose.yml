services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: devmentor
      POSTGRES_PASSWORD: devmentor
      POSTGRES_DB: devmentor
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devmentor"]
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:
