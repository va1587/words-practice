# Git hooks — installed by `npm install` (root `prepare` script).
pre-commit:
  parallel: true
  jobs:
    - name: prettier
      glob: "*.{ts,tsx,mts,mjs,js,json,css,md,yml,yaml}"
      run: npx prettier --write --ignore-unknown {staged_files}
      stage_fixed: true
    - name: eslint
      root: "packages/"
      glob: "*.{ts,tsx,mts,mjs}"
      run: npm run lint --workspaces --if-present --silent
commit-msg:
  jobs:
    - name: commitlint
      run: npx commitlint --edit {1}
