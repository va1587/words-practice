# Continuous integration for every pull request — each requirement is a separate status check.
# Steps mirror the local scripts (README "Skrypty"). Actions are pinned to commit SHAs
# (supply-chain policy); Renovate updates them after 14 days.
# Runner images are pinned (not `ubuntu-latest`) so an image migration never changes CI silently.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Git hooks are a local concern: LEFTHOOK=0 disables running them (the `prepare` install is harmless).
  LEFTHOOK: "0"

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # `next build` does not need a database (data is read at request time).
      - run: npm run build

  lint:
    name: Lint, format, types, dead code, audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run knip
      - run: npm run audit

  unit:
    name: Unit tests (100% coverage)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Vitest in every package; coverage thresholds are 100% (AGENTS.md) and fail the job below.
      - run: npm run test:coverage
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: coverage
          path: packages/*/coverage
          retention-days: 7

  integration:
    name: Integration tests (Testcontainers PostgreSQL + agent-browser)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Chrome for agent-browser plus its Linux system libraries.
      - run: npx agent-browser install --with-deps
        working-directory: packages/app
      # db: repositories on a Testcontainers PostgreSQL.
      # app: production build started against a Testcontainers PostgreSQL, driven by agent-browser.
      - run: npm run test:integration
